name: Build Zenith resource-pack fix

on:
  workflow_dispatch:
  push:
    branches: [resourcepack-async-join]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      RELEASE_TAG: 3.7.0+linux.26.2.0.resourcepackasync
    steps:
