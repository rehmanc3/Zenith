          -        // todo: we need to make the zenith mc server wait until the player has sent a response to the resource pack prompt(s)
          -//        resourcePacks.forEach((uuid, resourcePack) -> consumer.accept(new ClientboundResourcePackPushPacket(
          -//            resourcePack.id(),
          -//            resourcePack.url(),
          -//            resourcePack.hash(),
          -//            resourcePack.required(),
          -//            resourcePack.prompt()
          -//        )));
                   consumer.accept(new ClientboundUpdateTagsPacket(this.tags));
          +        // resource pack sync to players handled by com.zenith.network.server.ResourcePackSync
               }
           
               @Override
          diff --git a/src/main/java/com/zenith/network/codec/PacketCodecRegistries.java b/src/main/java/com/zenith/network/codec/PacketCodecRegistries.java
          index b58a12926..0db4b68c6 100644
          --- a/src/main/java/com/zenith/network/codec/PacketCodecRegistries.java
          +++ b/src/main/java/com/zenith/network/codec/PacketCodecRegistries.java
          @@ -29,6 +29,7 @@
           import org.geysermc.mcprotocollib.protocol.packet.common.serverbound.ServerboundClientInformationPacket;
           import org.geysermc.mcprotocollib.protocol.packet.common.serverbound.ServerboundKeepAlivePacket;
           import org.geysermc.mcprotocollib.protocol.packet.common.serverbound.ServerboundPongPacket;
          +import org.geysermc.mcprotocollib.protocol.packet.common.serverbound.ServerboundResourcePackPacket;
           import org.geysermc.mcprotocollib.protocol.packet.configuration.clientbound.*;
           import org.geysermc.mcprotocollib.protocol.packet.configuration.serverbound.ServerboundFinishConfigurationPacket;
           import org.geysermc.mcprotocollib.protocol.packet.handshake.serverbound.ClientIntentionPacket;
          @@ -305,6 +306,7 @@ private PacketCodecRegistries() {}
                       .setPriority(0)
                       .state(ProtocolState.CONFIGURATION, PacketHandlerStateCodec.serverBuilder()
                           .inbound(ServerboundFinishConfigurationPacket.class, new FinishConfigurationHandler())
          +                .inbound(ServerboundResourcePackPacket.class, new SResourcePackHandler())
                           .inbound(ServerboundClientInformationPacket.class, SClientInformationHandler.INSTANCE)
                           .outbound(ClientboundKeepAlivePacket.class, KeepAliveOutgoingHandler.INSTANCE)
                           .postOutbound(ClientboundFinishConfigurationPacket.class, new ClientFinishConfigurationPostOutgoingHandler())
          diff --git a/src/main/java/com/zenith/network/server/ResourcePackSync.java b/src/main/java/com/zenith/network/server/ResourcePackSync.java
          new file mode 100644
          index 000000000..75e306039
          --- /dev/null
          +++ b/src/main/java/com/zenith/network/server/ResourcePackSync.java
          @@ -0,0 +1,60 @@
          +package com.zenith.network.server;
          +
          +import com.zenith.cache.data.config.ResourcePack;
          +import com.zenith.event.player.PlayerConfigurationEvent;
          +import lombok.Getter;
          +import org.geysermc.mcprotocollib.protocol.packet.common.clientbound.ClientboundResourcePackPushPacket;
          +import org.geysermc.mcprotocollib.protocol.packet.common.serverbound.ServerboundResourcePackPacket;
          +import org.geysermc.mcprotocollib.protocol.packet.configuration.clientbound.ClientboundFinishConfigurationPacket;
          +import org.jspecify.annotations.Nullable;
          +
          +import java.util.ArrayDeque;
          +import java.util.Collection;
          +import java.util.UUID;
          +
          +import static com.zenith.Globals.EVENT_BUS;
          +import static com.zenith.Globals.SERVER_LOG;
          +
          +public class ResourcePackSync {
          +    private final ServerSession session;
          +    private final ArrayDeque<ResourcePack> pending = new ArrayDeque<>();
          +    private @Nullable UUID currentPackId;
          +    private boolean started;
          +    @Getter private boolean complete;
          +
          +    public ResourcePackSync(ServerSession session) {
          +        this.session = session;
          +    }
          +
          +    public void start(Collection<ResourcePack> packs) {
          +        if (started) return;
          +        started = true;
          +        // Snapshot the cache: other connections and upstream updates must not alter this exchange.
          +        pending.addAll(packs);
          +        sendNext();
          +    }
          +
          +    public void handleResponse(ServerboundResourcePackPacket packet) {
          +        if (currentPackId == null || !currentPackId.equals(packet.getId())) {
          +            SERVER_LOG.warn("Received unexpected resource pack response from {} for pack {}", session, packet.getId());
          +            return;
          +        }
          +        switch (packet.getStatus()) {
          +            case ACCEPTED, DOWNLOADED -> { }
          +            case SUCCESSFULLY_LOADED, DECLINED, FAILED_DOWNLOAD, INVALID_URL, FAILED_RELOAD, DISCARDED -> sendNext();
          +        }
          +    }
          +
          +    private void sendNext() {
          +        var pack = pending.poll();
          +        if (pack == null) {
          +            currentPackId = null;
          +            complete = true;
          +            EVENT_BUS.post(new PlayerConfigurationEvent.Exiting(session));
          +            session.sendAsync(new ClientboundFinishConfigurationPacket());
          +        } else {
          +            currentPackId = pack.id();
          +            session.sendAsync(new ClientboundResourcePackPushPacket(pack.id(), pack.url(), pack.hash(), false, pack.prompt()));
          +        }
          +    }
          +}
