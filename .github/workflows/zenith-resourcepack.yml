      - name: Set up GraalVM (build machine only)
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native Linux executable
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew nativeCompile -x test --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g

      - name: Package executable and companion libraries
        shell: bash
        run: |
          test -x build/native/nativeCompile/ZenithProxy
          mkdir -p package
          cp build/native/nativeCompile/ZenithProxy package/
          for lib in build/native/nativeCompile/*.so; do
            if [ -f "$lib" ]; then cp "$lib" package/; fi
          done
          cp /tmp/zenith-resourcepack.patch package/
          cp /tmp/zenith-resourcepack-async.patch package/
          cp LICENSE package/
          printf '%s\n' 'Base: https://github.com/rfresh2/ZenithProxy/commit/a7020137e86f11d1219322368d6ec045429565b8' 'Fix: https://github.com/rfresh2/ZenithProxy/commit/182bc3452163aee09d97241016bcfb49b7641c34' 'Apply both enclosed patches in order to the base to reproduce the source.' > package/SOURCE.txt
          tar -czf ZenithProxy-resourcepack-async-linux.tar.gz -C package .
          sha256sum ZenithProxy-resourcepack-async-linux.tar.gz > ZenithProxy-resourcepack-async-linux.tar.gz.sha256

      - name: Upload download bundle
        uses: actions/upload-artifact@v7
        with:
          name: ZenithProxy-resourcepack-async-linux
          path: |
            ZenithProxy-resourcepack-async-linux.tar.gz
            ZenithProxy-resourcepack-async-linux.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
