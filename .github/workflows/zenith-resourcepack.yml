           import org.geysermc.mcprotocollib.protocol.packet.login.serverbound.ServerboundLoginAcknowledgedPacket;
           
           import static com.zenith.Globals.*;
          @@ -35,8 +34,7 @@ public ServerboundLoginAcknowledgedPacket apply(final ServerboundLoginAcknowledg
                   CACHE.getRegistriesCache().getRegistryPackets(session::sendAsync, session);
                   CACHE.getConfigurationCache().getConfigurationPackets(session::sendAsync, session);
                   session.sendAsync(new ClientboundCustomPayloadPacket(Key.key("minecraft:brand"), CACHE.getChunkCache().getServerBrand()));
          -        EVENT_BUS.post(new PlayerConfigurationEvent.Exiting(session));
          -        session.sendAsync(new ClientboundFinishConfigurationPacket());
          +        session.getResourcePackConfiguration().start(CACHE.getConfigurationCache().getResourcePacks().values());
                   return null;
               }
           }
          diff --git a/src/main/java/com/zenith/network/server/handler/shared/incoming/SResourcePackHandler.java b/src/main/java/com/zenith/network/server/handler/shared/incoming/SResourcePackHandler.java
          new file mode 100644
          index 000000000..914c58f58
          --- /dev/null
          +++ b/src/main/java/com/zenith/network/server/handler/shared/incoming/SResourcePackHandler.java
          @@ -0,0 +1,14 @@
          +package com.zenith.network.server.handler.shared.incoming;
          +
          +import com.zenith.network.codec.PacketHandler;
          +import com.zenith.network.server.ServerSession;
          +import org.geysermc.mcprotocollib.protocol.packet.common.serverbound.ServerboundResourcePackPacket;
          +
          +public class SResourcePackHandler implements PacketHandler<ServerboundResourcePackPacket, ServerSession> {
          +    @Override
          +    public ServerboundResourcePackPacket apply(ServerboundResourcePackPacket packet, ServerSession session) {
          +        if (session.isConfigured()) return packet;
          +        session.getResourcePackConfiguration().handleResponse(packet);
          +        return null;
          +    }
          +}
